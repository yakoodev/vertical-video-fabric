{% extends "base.html" %}
{% block content %}
<div class="topline">
  <h1>New Post</h1>
  <a class="button" href="/accounts">Accounts</a>
</div>

<section class="panel">
  <form method="post" action="/ui/posts" enctype="multipart/form-data" class="grid">
    <label>Video File
      <input type="file" name="file" accept="video/*" required>
    </label>
    <div class="grid two">
      <label>Title
        <input name="title" maxlength="100" required>
      </label>
      <label>Privacy
        <select name="privacy">
          <option value="public" selected>Public</option>
          <option value="unlisted">Unlisted</option>
          <option value="private">Private</option>
        </select>
      </label>
    </div>
    <label>Description
      <textarea name="description"></textarea>
    </label>
    <label>Targets</label>
    <div class="targets">
      {% for account in accounts %}
      <label class="target-row">
        <input type="checkbox" name="targets" value="{{ account.id }}">
        {{ account.platform }} / {{ account.label }}
        {% if not account.has_required_cookies %}
        <span class="status needs_reauth">missing {{ account.missing_cookies }}</span>
        {% endif %}
      </label>
      {% else %}
      <div class="muted">Add an account first.</div>
      {% endfor %}
    </div>
    <label>Comments
      <select name="allow_comments">
        <option value="true" selected>Enabled</option>
        <option value="false">Disabled</option>
      </select>
    </label>
    <div>
      <button type="submit">Queue Post</button>
    </div>
  </form>
</section>
{% endblock %}
