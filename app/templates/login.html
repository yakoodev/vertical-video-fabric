<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход · Vertical Video Fabric</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #08090f;
        --surface: #13151f;
        --border: rgba(255, 255, 255, 0.09);
        --text: #f2f3f7;
        --dim: #9ba3b4;
        --accent: #7b6cff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
        background-image:
          radial-gradient(120% 80% at 20% 0%, rgba(123, 108, 255, 0.18), transparent 55%),
          radial-gradient(90% 70% at 100% 100%, rgba(88, 182, 255, 0.08), transparent 55%);
      }
      .panel {
        width: min(380px, 92vw);
        padding: 34px 30px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 40%), var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 26px;
      }
      .mark {
        position: relative;
        width: 22px;
        height: 30px;
        border-radius: 6px;
        background: linear-gradient(135deg, #7b6cff, #a06bff);
        box-shadow: 0 8px 24px rgba(123, 108, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }
      .mark::after {
        content: "";
        position: absolute;
        inset: 0;
        margin: auto;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 5px 0 5px 8px;
        border-color: transparent transparent transparent #fff;
      }
      .word { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 17px; line-height: 1; }
      .word small {
        display: block;
        font-family: "JetBrains Mono", monospace;
        font-size: 9px;
        letter-spacing: 0.28em;
        color: #626a7b;
        margin-top: 4px;
      }
      form { display: grid; gap: 14px; }
      label { display: grid; gap: 6px; font-size: 13px; color: var(--dim); font-weight: 600; }
      input {
        width: 100%;
        padding: 11px 13px;
        border-radius: 11px;
        border: 1px solid var(--border);
        background: #0e1019;
        color: var(--text);
        font-size: 14px;
      }
      input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(123, 108, 255, 0.18); }
      button {
        margin-top: 4px;
        padding: 11px 16px;
        border: 0;
        border-radius: 11px;
        background: linear-gradient(135deg, #7b6cff, #a06bff);
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 6px 18px rgba(123, 108, 255, 0.3);
      }
      button:hover { filter: brightness(1.06); }
      .form-error {
        color: #ff5a6a;
        font-size: 13px;
        background: rgba(255, 90, 106, 0.12);
        padding: 8px 11px;
        border-radius: 9px;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="brand">
        <span class="mark"></span>
        <span class="word">FABRIC<small>VERTICAL VIDEO</small></span>
      </div>
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}" />
        <label>
          Токен доступа
          <input name="token" type="password" autocomplete="current-password" required autofocus />
        </label>
        {% if error %}
        <div class="form-error">{{ error }}</div>
        {% endif %}
        <button type="submit">Войти</button>
      </form>
    </main>
  </body>
</html>
