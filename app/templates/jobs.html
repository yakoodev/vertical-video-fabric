{% extends "base.html" %}
{% block content %}
<div class="topline">
  <h1>Jobs</h1>
  <a class="button" href="/posts/new">New Post</a>
</div>

<section class="panel">
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Status</th>
        <th>Title</th>
        <th>Targets</th>
        <th>Created</th>
      </tr>
    </thead>
    <tbody>
      {% for job in jobs %}
      <tr>
        <td><a href="/jobs/{{ job.id }}">#{{ job.id }}</a></td>
        <td><span class="status {{ job.status }}">{{ job.status }}</span></td>
        <td>{{ job.title }}</td>
        <td>{{ job.targets|length }}</td>
        <td class="muted">{{ job.created_at }}</td>
      </tr>
      {% else %}
      <tr><td colspan="5" class="muted">No jobs yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
