<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vertical Video Fabric</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">Vertical Video Fabric</div>
        <nav class="nav">
          <a href="/sources" class="{{ 'active' if active == 'sources' else '' }}">Sources</a>
          <a href="/clips" class="{{ 'active' if active == 'clips' else '' }}">Clips</a>
          <a href="/presets" class="{{ 'active' if active == 'presets' else '' }}">Presets</a>
          <a href="/posts/new" class="{{ 'active' if active == 'new' else '' }}">New Post</a>
          <a href="/jobs" class="{{ 'active' if active == 'jobs' else '' }}">Jobs</a>
          <a href="/accounts" class="{{ 'active' if active == 'accounts' else '' }}">Accounts</a>
          <a href="/docs" class="{{ 'active' if active == 'docs' else '' }}">API Docs</a>
        </nav>
        <form method="post" action="/logout" class="logout-form">
          <button type="submit" class="nav-button">Logout</button>
        </form>
      </aside>
      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
