<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f5a524"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="460" rx="14" fill="#0e1015"/>
  <text x="24" y="34" fill="#e6e8ec" font-size="17" font-weight="700">Шаг 2. Настройки → Аккаунты</text>
  <text x="24" y="56" fill="#9aa0aa" font-size="13">Вставь cookies в форму. В чат значения не вставляй — только сюда.</text>

  <!-- form panel -->
  <rect x="250" y="76" width="366" height="364" rx="12" fill="#14161c" stroke="#2a2f3a"/>
  <text x="268" y="102" fill="#e6e8ec" font-size="14" font-weight="700">Добавить аккаунт</text>

  <!-- platform -->
  <text x="268" y="128" fill="#9aa0aa" font-size="11">Платформа</text>
  <rect x="268" y="134" width="160" height="30" rx="7" fill="#1c2230" stroke="#6e7bff" stroke-width="2"/>
  <text x="280" y="154" fill="#aeb6ff" font-size="12" font-weight="600">tiktok ▾</text>
  <!-- label -->
  <text x="446" y="128" fill="#9aa0aa" font-size="11">Метка</text>
  <rect x="446" y="134" width="152" height="30" rx="7" fill="#0c0e13" stroke="#2a2f3a"/>
  <text x="458" y="154" fill="#c7ccd6" font-size="12">tt-main</text>

  <!-- proxy -->
  <text x="268" y="186" fill="#9aa0aa" font-size="11">Прокси (необязательно)</text>
  <rect x="268" y="192" width="330" height="30" rx="7" fill="#0c0e13" stroke="#2a2f3a"/>
  <text x="280" y="212" fill="#7e8694" font-size="11.5">http://user:pass@host:port</text>

  <!-- cookies -->
  <text x="268" y="244" fill="#9aa0aa" font-size="11">Cookies</text>
  <rect x="268" y="250" width="330" height="110" rx="7" fill="#0c0e13" stroke="#6e7bff" stroke-width="2"/>
  <text x="280" y="272" fill="#7e8694" font-size="10.5"># Netscape HTTP Cookie File</text>
  <text x="280" y="290" fill="#7e8694" font-size="10.5">.tiktok.com  TRUE  /  TRUE  …  sessionid</text>
  <text x="280" y="308" fill="#7e8694" font-size="10.5">.tiktok.com  TRUE  /  TRUE  …  sid_tt</text>
  <text x="280" y="326" fill="#7e8694" font-size="10.5">…</text>

  <!-- save -->
  <rect x="268" y="378" width="150" height="34" rx="8" fill="#6e7bff"/>
  <text x="343" y="400" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">Сохранить аккаунт</text>

  <!-- callouts -->
  <text x="24" y="150" fill="#f5a524" font-size="12.5" font-weight="700">1) Платформа</text>
  <line x1="120" y1="150" x2="266" y2="150" stroke="#f5a524" stroke-width="2" marker-end="url(#ah2)"/>

  <text x="24" y="210" fill="#f5a524" font-size="12.5" font-weight="700">2) Прокси (HTTP/S порт)</text>
  <line x1="180" y1="208" x2="266" y2="207" stroke="#f5a524" stroke-width="2" marker-end="url(#ah2)"/>

  <text x="24" y="300" fill="#f5a524" font-size="12.5" font-weight="700">3) Вставь cookies</text>
  <text x="24" y="320" fill="#9aa0aa" font-size="11.5">Ctrl+V (Netscape или JSON)</text>
  <line x1="150" y1="300" x2="266" y2="300" stroke="#f5a524" stroke-width="2" marker-end="url(#ah2)"/>

  <text x="24" y="398" fill="#f5a524" font-size="12.5" font-weight="700">4) Сохранить</text>
  <line x1="110" y1="398" x2="266" y2="396" stroke="#f5a524" stroke-width="2" marker-end="url(#ah2)"/>
</svg>
